services:
  postgres:
    image: postgres:16-alpine
    container_name: belajarku-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-belajarku}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d belajarku"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - belajarku-network

  redis:
    image: redis:7-alpine
    container_name: belajarku-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - belajarku-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: belajarku-api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Bind mounts for live code reloading
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./scripts:/app/scripts
      - ./package.json:/app/package.json
      - belajarku-uploads:/app/uploads
      # Anonymous volume preventing host OS architecture node_modules pollution
      - /app/node_modules
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/belajarku?schema=public}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      JWT_SECRET: "${JWT_SECRET:-belajarku_super_secret_jwt_key_demo_2026}"
      PORT: "${PORT:-5000}"
      NODE_ENV: "${NODE_ENV:-development}"
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
    networks:
      - belajarku-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: belajarku-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      PORT: "${FRONTEND_PORT:-3000}"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:5000}"
      INTERNAL_API_URL: "${INTERNAL_API_URL:-http://api:5000}"
    networks:
      - belajarku-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  belajarku-uploads:
    driver: local

networks:
  belajarku-network:
    driver: bridge
